<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#047857" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="150" cy="150" r="136" fill="#ffffff" stroke="url(#emeraldGrad)" stroke-width="8" filter="url(#shadow)" />
  <circle cx="150" cy="150" r="124" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 4" />
  <circle cx="150" cy="150" r="114" fill="#f0fdf4" stroke="#10b981" stroke-width="2" />

  <!-- Stars -->
  <g fill="url(#goldGrad)">
    <polygon points="150,42 153,49 160,49 155,54 157,61 150,57 143,61 145,54 140,49 147,49" transform="translate(-105, 100)" />
    <polygon points="150,42 153,49 160,49 155,54 157,61 150,57 143,61 145,54 140,49 147,49" transform="translate(105, 100)" />
  </g>

  <!-- Top Curved Text: HALAL CERTIFIED -->
  <path id="curveTop" d="M 50,150 A 100,100 0 0,1 250,150" fill="none" />
  <text font-family="'Outfit', 'Arial Black', sans-serif" font-size="19" font-weight="900" fill="#065f46" letter-spacing="3.5">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">
      HALAL CERTIFIED
    </textPath>
  </text>

  <!-- Central Arabic Calligraphy for HALAL (حلال) -->
  <g transform="translate(150, 142) scale(1.15)">
    <!-- Elegant Stylized Arabic Halal Symbol -->
    <path d="M -45,10 C -40,-25 -20,-35 0,-35 C 20,-35 40,-25 45,10 C 35,28 10,32 0,32 C -10,32 -35,28 -45,10 Z" fill="none" stroke="#047857" stroke-width="3" />
    <circle cx="0" cy="-2" r="32" fill="#ecfdf5" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Arabic Letters: حلال -->
    <text x="0" y="10" font-family="'Traditional Arabic', 'Scheherazade', 'Amiri', 'Arial', sans-serif" font-size="44" font-weight="bold" fill="#047857" text-anchor="middle">
      حلال
    </text>
  </g>

  <!-- Subtitle Ribbon: TS OIC SMIIC 1 -->
  <rect x="55" y="194" width="190" height="24" rx="12" fill="url(#emeraldGrad)" />
  <text x="150" y="210" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    TS OIC SMIIC 1:2011
  </text>

  <!-- Bottom Curved Text: NOVA CERT INTERNATIONAL -->
  <path id="curveBottom" d="M 245,160 A 98,98 0 0,1 55,160" fill="none" />
  <text font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="11.5" font-weight="800" fill="#047857" letter-spacing="2">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">
      NOVA CERT INTERNATIONAL
    </textPath>
  </text>
</svg>
